# Experiment registry for YOLO detection sweeps (thesis run matrix).
# Each experiment describes CLI args passed to src/yolo/yolo_detect.py.
# This file mirrors the run matrix in docs/THESIS_PLAN.md and docs/RUN_MATRIX.md.

base_args:
  # Shared defaults. 
  # Decisions locked after exploratory runs (BS/R0/A/B series):
  # - Batch size: 32 (BS pilot)
  # - Rectangular processing: false (R0 results)
  # - Image size: 320 (A-series results)
  # - Model size: n (B-series results: nano generalizes best)
  batch: 32
  imgsz: 320
  eval_conf: 0.05
  device: 0
  model_size: n
  pretrained: true
  rect: false
  epochs: 150
  augs: spec_opt       # Spectrogram-optimized (mosaic=0, fliplr=0, hsv=0)
  seed: 42
  deterministic: true

experiments:
  # -----------------------
  # 0) BS-series: Batch Size Pilot
  # Early hardware constraint test on largest model to fix global batch size.
  # -----------------------
  - id: BS1
    description: Batch pilot (yolo12x, batch=32, imgsz=320, rect=False, epochs=200)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: x
      batch: 32
      imgsz: 320
      rect: false
      epochs: 200
      name: BS1

  - id: BS2
    description: Batch pilot (yolo12x, batch=64, imgsz=320, rect=False, epochs=200)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: x
      batch: 64
      imgsz: 320
      rect: false
      epochs: 200
      name: BS2

  # -----------------------
  # 1) R0: Rectangular Processing Ablation
  # Prove that rect=True is efficient and performant.
  # Uses yolo12m at fixed imgsz=256.
  # -----------------------
  - id: R0a
    description: Rectangular ablation (rect=True, imgsz=256)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: m
      rect: true
      imgsz: 320
      epochs: 150
      name: R0a

  - id: R0b
    description: Rectangular ablation (rect=False, imgsz=256)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: m
      rect: false
      imgsz: 320
      epochs: 150
      name: R0b

  # -----------------------
  # 2) A-series: Image Size Sweep
  # Find optimal resolution using rect=True and yolo12m.
  # -----------------------
  - id: A1
    description: Image size sweep (imgsz=192, rect=False)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: m
      imgsz: 192
      rect: false
      epochs: 150
      name: A1

  - id: A2
    description: Image size sweep (imgsz=320, rect=False)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: m
      imgsz: 320
      rect: false
      epochs: 150
      name: A2

  - id: A3
    description: Image size sweep (imgsz=640, rect=False)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: m
      imgsz: 640
      rect: false
      epochs: 150
      name: A3

  # -----------------------
  # 3) B-series: Model Size Sweep
  # Long runs to find T_opt and best model size.
  # NOTE: Update base_args['imgsz'] with result from A-series before running.
  # -----------------------
  - id: B1
    description: Model size sweep (yolo12n; long run for T_opt)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: n
      imgsz: 320
      rect: false
      epochs: 450
      patience: 0
      name: B1

  - id: B2
    description: Model size sweep (yolo12m; long run for T_opt)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: m
      imgsz: 320
      rect: false
      epochs: 450
      patience: 0
      name: B2

  - id: B3
    description: Model size sweep (yolo12x; long run for T_opt)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      model_size: x
      imgsz: 320
      rect: false
      epochs: 450
      patience: 0
      name: B3

  # -----------------------
  # 4) C-series: Augmentation Comparison
  # Locked settings: yolo12n, imgsz=320, rect=False, epochs=150.
  # B1 serves as the reference for 'spec_opt'.
  # -----------------------
  - id: C1
    description: Augmentation comparison (Ultralytics defaults)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      augs: defaults
      name: C1

  - id: C3
    description: Augmentation comparison (spec-opt + NoiseMix)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      augs: noise_mix
      noise_mix_alpha: 0.25
      noise_mix_p: 0.5
      name: C3

  # -----------------------
  # 5) D-series: Transfer Learning
  # NOTE: Update base_args['augs'] to best from C-series.
  # -----------------------
  - id: D1
    description: Transfer comparison (COCO-pretrained; epochs ≈ 1.2*T_opt)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      pretrained: true
      name: D1

  - id: D2
    description: Transfer comparison (Scratch; epochs ≈ 1.5*T_opt)
    fold: fold_BallenyIslands2015_noise_0.25
    args:
      pretrained: false
      # Override epochs manually here when dispatching if different from base_args
      name: D2

  # -----------------------
  # 6) F-series: Confirmatory Runs
  # Final 11-fold validation of best config.
  # -----------------------
  - id: F1
    description: Final compare (best config across all 11 folds)
    args:
      # Ensure base_args matches the final best configuration
      name: F1

  - id: F2
    description: Optional second-best config (runner-up)
    args:
      # Ensure base_args matches the runner-up configuration
      name: F2
